<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>
    <script>
        const age = Number(prompt("Quel est votre age?"));
        if (age >= 18) {
            alert("accès autorisé");
            if (age >= 20 && age <= 24) {
                alert("accès VIP");
            }
        } else {
            alert("accès refusé: Vous n'avez pas 18 ans.");
        }
    </script>
</body>
